<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration — La Longère</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f0e6;
      color: #333;
      margin: 0;
      padding: 30px;
    }

    .admin {
      max-width: 750px;
      margin: auto;
      background: white;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.10);
    }

    h1 {
      color: #58735b;
      text-align: center;
    }

    h2 {
      color: #58735b;
      margin-top: 30px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-top: 5px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #58735b;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .info {
      background: #f5f0e6;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="admin">

  <h1>Administration de La Longère</h1>

  <div class="info">
    Cette page vous permet de préparer facilement les informations
    que vous souhaitez modifier sur votre site.
  </div>

  <h2>Noms des chambres</h2>

  <label>Chambre Aubrac</label>
  <input id="aubrac_name" value="Aubrac">

  <label>Chambre Écir</label>
  <input id="ecir_name" value="Écir">

  <label>Chambre Argence</label>
  <input id="argence_name" value="Argence">

  <label>Chambre Viadène</label>
  <input id="viadene_name" value="Viadène">


  <h2>Tarifs chambres</h2>

  <label>1 nuit — chambre 2 personnes</label>
  <input id="single_1night" value="78 €">

  <label>2 à 4 nuits — chambre 2 personnes</label>
  <input id="single_2to4" value="74 €">

  <label>À partir de 5 nuits — chambre 2 personnes</label>
  <input id="single_5plus" value="70 €">

  <label>Argence + Viadène — 1 nuit</label>
  <input id="double_1night" value="136 €">

  <label>Argence + Viadène — 2 à 4 nuits</label>
  <input id="double_2to4" value="128 €">

  <label>Argence + Viadène — à partir de 5 nuits</label>
  <input id="double_5plus" value="120 €">


  <h2>Table d'hôtes</h2>

  <label>Prix du menu</label>
  <input id="table_price" value="26 €">


  <h2>Coordonnées</h2>

  <label>Téléphone</label>
  <input id="phone" value="06 83 15 72 33">

  <label>Adresse e-mail</label>
  <input id="email" value="lalongere.bouges@gmail.com">


  <button onclick="preparer()">
    Préparer mes modifications
  </button>

</div>


<script>
function preparer() {

  const data = {
    aubrac_name: document.getElementById("aubrac_name").value,
    ecir_name: document.getElementById("ecir_name").value,
    argence_name: document.getElementById("argence_name").value,
    viadene_name: document.getElementById("viadene_name").value,

    single_1night: document.getElementById("single_1night").value,
    single_2to4: document.getElementById("single_2to4").value,
    single_5plus: document.getElementById("single_5plus").value,

    double_1night: document.getElementById("double_1night").value,
    double_2to4: document.getElementById("double_2to4").value,
    double_5plus: document.getElementById("double_5plus").value,

    table_price: document.getElementById("table_price").value,
    phone: document.getElementById("phone").value,
    email: document.getElementById("email").value
  };

  const contenu = JSON.stringify(data, null, 2);

  navigator.clipboard.writeText(contenu).then(function() {
    alert(
      "Vos modifications sont prêtes et ont été copiées. " +
      "Vous pourrez ensuite les enregistrer dans le fichier site-data.json."
    );
  });
}
</script>

</body>
</html>
